services:
  taratulong_db:
    image: postgres:15-alpine
    container_name: taratulong_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - taratulong_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  taratulong_api:
    build: .
    container_name: taratulong_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      taratulong_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: taratulong_db
    networks:
      - taratulong_network

volumes:
  pg_data:

networks:
  taratulong_network:
    driver: bridge
