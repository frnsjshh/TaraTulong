name: TaraTulong CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: taratulong_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: taratulong_ci
          DB_USERNAME: ci_user
          DB_PASSWORD: ci_password
          JWT_SECRET: ci-test-secret
        run: ./mvnw test


      - name: Build Docker image
        run: docker build -t taratulong-api:ci .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag taratulong-api:ci ghcr.io/${{ github.repository_owner }}/taratulong-api:ci

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/taratulong-api:ci
